[package]
name = "filegoblin-core"
version = "1.12.0"
edition = "2024"
rust-version = "1.87"
description = "Conversion engine behind filegoblin: any file, URL, or media into clean Markdown."
repository = "https://github.com/funkyfunc/filegoblin"
license = "MIT"
keywords = ["markdown", "llm", "parser", "ocr", "extraction"]
categories = ["text-processing", "parser-implementations"]


[features]
default = []
web = ["dep:reqwest", "dep:governor", "dep:robotxt", "dep:tokio", "dep:encoding_rs"]
# macOS needs no feature: Apple Vision OCR is built in. This gates only the
# pure-Rust fallback engine for Linux (ocrs/rten) and the Windows OCR API path.
ocr = ["dep:rten", "dep:rten-tensor", "dep:ocrs", "dep:tokio"]
wasm = ["dep:wasmtime"]
rag = ["dep:tantivy"]
# Audio/video → transcript via whisper.cpp. Build needs cmake + a C/C++
# compiler (statically linked — allowed per the engineering standard). The
# model (~574MB) auto-downloads on first use to ~/.filegoblin/models.
transcribe = ["dep:whisper-rs", "dep:symphonia", "dep:opus", "dep:ureq"]
# Metal GPU acceleration on macOS (needs Xcode CLT at build time).
transcribe-metal = ["transcribe", "whisper-rs/metal"]

[dependencies]
aho-corasick = { version = "1.1.4", features = ["perf-literal", "std"] }
anyhow = "1.0.102"
arboard = "3.6.1"
calamine = "0.33.0"
clap = { version = "4.5.60", features = ["derive", "env"] }
colored = "3.1.1"
csv = "1.4.0"
dashmap = "6.1.0"
docx-rs = "0.4.19"
git2 = "0.20.4"
globset = "0.4.18"
governor = { version = "0.10.4", optional = true }
home = "0.5.12"
html2md = "0.2.15"
ignore = "0.4.25"
# Non-optional: PDF scanned-page OCR encodes extracted page images (any OS),
# and pdf_oxide already puts `image` in the tree anyway.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "tiff"] }
logos = "0.16.1"
minify-html = "0.18.1"
ocrs = { version = "0.12.1", optional = true }
open = "5.3.3"
# Chosen over oxidize-pdf for: native markdown conversion (headings/tables/
# reading order), per-page scanned/text classification for the OCR fallback,
# and no rusty-tesseract shell-out in its dependency tree. See ADR 2026-07-30.
pdf_oxide = "0.3.73"
pulldown-cmark = "0.13.1"
pulldown-cmark-to-cmark = "22.0.0"
quick-xml = "0.39.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls", "json", "cookies"], optional = true }
robotxt = { version = "0.6.1", optional = true }
rten = { version = "0.24.0", optional = true }
rten-tensor = { version = "0.24.0", optional = true }
# Always-on: the DOM-based HTML→markdown extractor (parsers/html.rs) is a core
# parser, not a web-only one (local .html files and EPUB chapters use it too).
scraper = "0.25.0"
encoding_rs = { version = "0.8", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
# Cache keys (pure Rust)
sha2 = "0.10"
whisper-rs = { version = "0.16", optional = true }
# Defaults already cover flac/ogg/vorbis/wav/pcm/mkv; opt into the rest.
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "caf"], optional = true }
# Opus decode (bundled libopus, statically linked) — symphonia demuxes webm/mkv/ogg/caf but has no Opus decoder
opus = { version = "0.3", optional = true }
ureq = { version = "2.10", default-features = false, features = ["tls"], optional = true }
serde_json = "1.0.149"
rayon = "1.10.0"
tantivy = { version = "0.22", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["rt", "macros", "sync", "time"], optional = true }
tree-sitter = { version = "0.26.5", features = ["std"] }
tree-sitter-rust = "0.24.0"
url = "2.5.8"
wasmtime = { version = "41.0.3", features = ["component-model"], optional = true }
zip = "8.1.0"
tar = "0.4.46"
flate2 = "1.1.9"
mail-parser = "0.11"
rtf-parser = "0.4"

[build-dependencies]
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
clap_mangen = "0.2.31"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Storage", "Graphics_Imaging", "Foundation", "Storage_Streams"] }

