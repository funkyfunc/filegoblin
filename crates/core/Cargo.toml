[package]
name = "filegoblin-core"
version = "1.9.1"
edition = "2024"
description = "A zero-dependency, high-performance CLI tool to convert messy file formats into high-fidelity, LLM-optimized Markdown/XML/YAML."
repository = "https://github.com/funkyfunc/filegoblin"
license = "MIT"
exclude = [
    "examples/*",
    "docs/*",
    "test_assets/*",
    "assets/*",
    ".github/*",
    "empty_test_dir/*"
]


[features]
default = []
web = ["dep:reqwest", "dep:scraper", "dep:governor", "dep:robotxt", "dep:html2md"]
ocr = ["dep:rten", "dep:rten-tensor", "dep:candle-core", "dep:ocrs", "dep:image"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
rag = ["dep:tantivy"]

[dependencies]
aho-corasick = { version = "1.1.4", features = ["perf-literal", "std"] }
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
calamine = "0.33.0"
candle-core = { version = "0.9", features = ["mkl"], optional = true }
clap = { version = "4.5.60", features = ["derive", "env"] }
colored = "3.1.1"
csv = "1.4.0"
dashmap = "6.1.0"
docx-rs = "0.4.19"
fst = { version = "0.4.7", features = ["levenshtein"] }
git2 = "0.20.4"
governor = { version = "0.10.4", optional = true }
home = "0.5.12"
html2md = { version = "0.2.15", optional = true }
ignore = "0.4.25"
image = { version = "0.25.9", optional = true }
logos = "0.16.1"
memmap2 = "0.9"
minify-html = "0.18.1"
nojson = "0.3.8"
nonzero_ext = "0.3.0"
notify = "8.2.0"
ocrs = { version = "0.12.1", optional = true }
open = "5.3.3"
oxidize-pdf = "1.7.1"
pulldown-cmark = "0.13.1"
pulldown-cmark-to-cmark = "22.0.0"
quick-xml = "0.39.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls", "json", "cookies"], optional = true }
robotxt = { version = "0.6.1", optional = true }
rten = { version = "0.24.0", optional = true }
rten-tensor = { version = "0.24.0", optional = true }
safetensors = "0.4"
scraper = { version = "0.25.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.10.0"
sha2 = "0.10.9"
sliding_features = "7.1"
stop-words = "0.10.0"
tantivy = { version = "0.22", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["rt", "macros", "sync", "time"] }
tree-sitter = { version = "0.26.5", features = ["std"] }
tree-sitter-rust = "0.24.0"
url = "2.5.8"
urlencoding = "2.1.3"
wasmtime = { version = "41.0.3", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "42.0.0", optional = true }
zip = "8.1.0"

[build-dependencies]
cc = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
clap_mangen = "0.2.31"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
tokio = "1.49.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Storage", "Graphics_Imaging", "Foundation", "Storage_Streams"] }

