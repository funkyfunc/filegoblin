# Parked crate — not a member of the root workspace and not shipped in v1.
# Build it on its own: cargo build --manifest-path crates/tui/Cargo.toml
# Re-integrating means adding `filegoblin-tui = { path = "../tui", optional
# = true }` back to crates/cli plus a `tui = ["dep:filegoblin-tui",
# "filegoblin-tui?/web"]` feature — note the `?/web`, whose absence previously
# shipped a TUI whose URL browsing was dead.
[workspace]

[package]
name = "filegoblin-tui"
version = "1.12.0"
edition = "2024"
rust-version = "1.87"
description = "Interactive TUI file explorer for filegoblin (parked, not shipped in v1)."
repository = "https://github.com/funkyfunc/filegoblin"
license = "MIT"
publish = false


[features]
default = []
web = ["filegoblin-core/web", "dep:reqwest", "dep:scraper"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
filegoblin-core = { path = "../core" }
ignore = "0.4.25"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"], optional = true }
scraper = { version = "0.25.0", optional = true }
url = "2.5.8"
