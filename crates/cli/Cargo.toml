[package]
name = "filegoblin"
version = "1.14.0"
edition = "2024"
rust-version = "1.87"
description = "Point it at any file, URL, or media and get clean Markdown for LLMs and agents."
repository = "https://github.com/funkyfunc/filegoblin"
readme = "../../README.md"
keywords = ["markdown", "llm", "pdf", "ocr", "converter"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT"

[[bin]]
name = "filegoblin"
path = "src/main.rs"

[features]
# `web` is on by default: "convert websites to markdown" is half the product's
# pitch, so a plain `cargo install` must be able to do it.
default = ["web"]
web = ["filegoblin-core/web"]
ocr = ["filegoblin-core/ocr"]
vision = ["filegoblin-core/vision"]
bundled-models = ["filegoblin-core/bundled-models"]
wasm = ["filegoblin-core/wasm"]
rag = ["filegoblin-core/rag"]
transcribe = ["filegoblin-core/transcribe"]
# macOS-only opt-in: whisper-rs-sys turns on GGML_METAL for every target when
# this is enabled, which cannot configure on Linux/Windows. Never put this in
# the dist feature list.
transcribe-metal = ["filegoblin-core/transcribe-metal"]

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.43"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.27"

[dependencies]
filegoblin-core = { path = "../core", version = "1.14.0" }
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env"] }
colored = "3.1.1"
# Raw-mode key handling for `--walk`. Terminal *drawing* is hand-rolled: the
# picker is one static layout, so ratatui would be a large dependency for a
# screen this simple (and this crate has no other UI).
crossterm = "0.29.0"
