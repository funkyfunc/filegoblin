[package]
name = "filegoblin"
version = "1.11.0"
edition = "2024"
description = "A zero-dependency, high-performance CLI tool to convert messy file formats into high-fidelity, LLM-optimized Markdown/XML/YAML."
repository = "https://github.com/funkyfunc/filegoblin"
license = "MIT"

[[bin]]
name = "filegoblin"
path = "src/main.rs"

[features]
# `web` is on by default: "convert websites to markdown" is half the product's
# pitch, so a plain `cargo install` must be able to do it.
default = ["web"]
web = ["filegoblin-core/web"]
ocr = ["filegoblin-core/ocr"]
wasm = ["filegoblin-core/wasm"]
rag = ["filegoblin-core/rag"]
transcribe = ["filegoblin-core/transcribe"]
transcribe-metal = ["filegoblin-core/transcribe-metal"]
tui = ["dep:filegoblin-tui"]

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.43"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.27"

[dependencies]
filegoblin-core = { path = "../core" }
filegoblin-tui = { path = "../tui", optional = true }
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env"] }
colored = "3.1.1"
