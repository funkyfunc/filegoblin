[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli"
]
# The wasm plugin example is a separate crate by design — a consumer of the
# published component API, not a workspace member.
exclude = [
    "examples/dummy_plugin"
]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
