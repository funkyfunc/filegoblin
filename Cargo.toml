[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli"
]
# Parked, not shipped in v1: the TUI is a standalone crate with its own
# workspace (build it with `cargo build --manifest-path crates/tui/Cargo.toml`).
# The wasm plugin example is a separate crate by design — a consumer of the
# published component API, not a workspace member.
exclude = [
    "crates/tui",
    "examples/dummy_plugin"
]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
# NOT `all-features`: that activates `transcribe-metal`, and whisper-rs-sys
# defines GGML_METAL=ON unconditionally (only the Apple *framework* link lines
# are target-gated), so every Linux and Windows target fails at cmake configure.
# Metal stays an opt-in source build for macOS users. See ADR 2026-08-02.
features = ["web", "ocr", "wasm", "rag", "transcribe"]
