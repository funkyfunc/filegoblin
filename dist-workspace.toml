[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# NOT `all-features`: that activates `transcribe-metal`, and whisper-rs-sys
# defines GGML_METAL=ON unconditionally (only the Apple *framework* link lines
# are target-gated), so every Linux and Windows target fails at cmake configure.
# Metal stays an opt-in source build for macOS users. See ADR 2026-08-02.
# (This list used to live in Cargo.toml's [workspace.metadata.dist], which
# dist ignores once dist-workspace.toml exists — the v1.14.0 release failed
# on exactly that.) `vision` adds the model runtime only; the weights ship as
# a separate release asset built by the vision-models job below.
features = ["web", "ocr", "wasm", "rag", "transcribe", "vision"]
# Builds the vision model archive once per release and attaches it, along
# with the filegoblin-full-<target> archives (models compiled in).
global-artifacts-jobs = ["./vision-models"]
# PyPI and npm publishing is not a dist job: it runs in publish.yml, a
# top-level workflow triggered when this one finishes, because PyPI's trusted
# publishing does not work from reusable workflows (pypa/gh-action-pypi-publish#166).
