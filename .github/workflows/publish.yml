name: Publish

# Publishes a release to PyPI and npm once the Release workflow (dist) has
# built it. Auth is tokenless through trusted publishing (OIDC): pushing the
# tag is the approval. The `pypi` and `npm` environments have no
# protection rules; they exist only to scope the trusted-publisher identities
# (PyPI: workflow publish.yml + environment pypi; npm: workflow publish.yml +
# environment npm). See docs/RELEASING.md for the one-time setup.
#
# This is its own top-level workflow, not a dist publish job, because PyPI's
# trusted publishing does not work from reusable workflows
# (pypa/gh-action-pypi-publish#166) and dist publish jobs are reusable ones.
#
#   PyPI: filegoblin (one wheel per platform), filegoblin-models and one
#         filegoblin-model-<name> per model  (`pip install "filegoblin[models]"`)
#   npm:  filegoblin, @filegoblin/<os>-<cpu>, @filegoblin/models and one
#         @filegoblin/model-<name> per model
#   (`scripts/package_registries.py names pypi|npm` lists them all.)
#
# The packages are built and smoke-tested by the `registry-packages` job of
# the Release run (vision-models.yml) and downloaded from it here. Re-running
# is safe: versions already on a registry are skipped.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID of a successful Release run to publish (from its URL)"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A finished tag build of Release (pull-request runs only plan), or a
    # manual run. Prereleases (v1.2.3-rc.1) are not published automatically.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_branch, '-'))
    permissions:
      actions: read # read the Release and Horde Check runs
    outputs:
      run-id: ${{ steps.run.outputs.id }}
    steps:
      # Through the environment, never spliced into the script: `run-id` is
      # free text typed into the dispatch form.
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "run-id must be a number, got: $RUN_ID"; exit 1 ;;
          esac
          # A manual run must still name a successful Release run, not any
          # run that happens to have a registry-packages artifact.
          read -r name conclusion sha < <(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --json workflowName,conclusion,headSha -q '"\(.workflowName) \(.conclusion) \(.headSha)"')
          if [ "$name" != "Release" ] || [ "$conclusion" != "success" ]; then
            echo "Run $RUN_ID is '$name' with conclusion '$conclusion', not a successful Release run"
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Publishing is permanent, and Release itself runs no tests: wait for
      # Horde Check on the same commit and refuse to publish unless it passed.
      # (v1.15.0 went out while Horde Check on its commit was red.)
      - name: Horde Check passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/horde-check.yml/runs?head_sha=$SHA&event=push" \
              -q '[.workflow_runs[] | "\(.status) \(.conclusion)"] | first // "none"')
            case "$result" in
              "completed success") echo "Horde Check passed on $SHA"; exit 0 ;;
              completed*) echo "Horde Check on $SHA finished as: $result"; exit 1 ;;
              none) echo "No Horde Check run for $SHA yet" ;;
              *) echo "Horde Check on $SHA: $result" ;;
            esac
            sleep 60
          done
          echo "Gave up waiting for Horde Check on $SHA"
          exit 1

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi # scopes the PyPI trusted-publisher identity (no gate)
    permissions:
      id-token: write # mint the short-lived OIDC token for trusted publishing
      actions: read # download the Release run's artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-packages
          run-id: ${{ needs.check.outputs.run-id }}
          github-token: ${{ github.token }}
      # The nine model projects don't exist on PyPI yet (see "Model
      # packages" in docs/RELEASING.md); delete this step once they do.
      - name: Base package only (model projects not on PyPI yet)
        run: rm -f wheels/filegoblin_model*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  npm:
    needs: check
    runs-on: ubuntu-latest
    environment: npm # scopes the npm trusted-publisher identity (no gate)
    permissions:
      id-token: write # mint the short-lived OIDC token for trusted publishing
      actions: read # download the Release run's artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-packages
          run-id: ${{ needs.check.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node ships older.
      - run: npm install -g npm@latest
      - name: Publish
        run: |
          # Dependencies first (platform packages and model parts, then
          # @filegoblin/models, then the filegoblin launcher), in the order
          # package_registries.py wrote. No NODE_AUTH_TOKEN: npm detects the
          # OIDC environment, authenticates itself and attaches provenance.
          set -e
          # Artifacts do not keep file modes.
          chmod +x npm-packages/platform-*/bin/filegoblin 2>/dev/null || true
          while read -r dir; do
            d="npm-packages/$dir"
            name=$(node -p "require('./$d/package.json').name")
            version=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            # "./" matters: npm reads a bare "npm-packages/<dir>" as the
            # GitHub repo <owner>/<repo> and refuses to fetch it (EALLOWGIT).
            #
            # Two 409s are not real failures. "Cannot publish over previously
            # staged version": an earlier run published it and npm is still
            # processing it (large packages take minutes to appear), so it's
            # done. TLOG_CREATE_ENTRY_ERROR: Sigstore's transparency log
            # rejected a retry of its own entry before anything was uploaded,
            # so publishing again is safe.
            for attempt in 1 2 3; do
              if npm publish "./$d" --access public --provenance > publish.log 2>&1; then
                cat publish.log
                break
              fi
              cat publish.log
              if grep -q "previously staged version" publish.log; then
                echo "$name@$version was published by an earlier run; npm is still processing it"
                break
              fi
              if grep -q TLOG_CREATE_ENTRY_ERROR publish.log && [ "$attempt" -lt 3 ]; then
                echo "transparency log conflict; publishing $name again"
                sleep 15
                continue
              fi
              exit 1
            done
          done < npm-packages/publish-order.txt
