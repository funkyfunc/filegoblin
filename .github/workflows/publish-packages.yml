# Publishes a release to PyPI and npm (dist `publish-jobs`; runs after the
# GitHub release is created). The packages themselves are built and
# smoke-tested by the `registry-packages` job in vision-models.yml.
#
#   PyPI: filegoblin (one wheel per platform, lite binary + launcher)
#         filegoblin-models, filegoblin-models-part1..N   (`filegoblin[models]`)
#   npm:  filegoblin, filegoblin-<os>-<cpu>
#         filegoblin-models, filegoblin-models-part1..N
#
# Each registry is skipped, with a warning, until it is set up:
#   PyPI: a `PYPI_API_TOKEN` repository secret, or trusted publishing for
#         this workflow on pypi.org plus the repository variable
#         `PYPI_TRUSTED_PUBLISHING=true`.
#   npm:  an `NPM_TOKEN` repository secret (an automation token).
# Re-running is safe: versions already on a registry are skipped.
name: publish-packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  pypi:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$PYPI_API_TOKEN" ] || [ "$TRUSTED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PyPI publishing skipped: set the PYPI_API_TOKEN secret or PYPI_TRUSTED_PUBLISHING=true"
          fi
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          name: registry-packages
      - name: Publish with a token
        if: steps.setup.outputs.enabled == 'true' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Publish with trusted publishing
        if: steps.setup.outputs.enabled == 'true' && env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  npm:
    runs-on: ubuntu-22.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::npm publishing skipped: set the NPM_TOKEN secret"
          fi
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          name: registry-packages
      - name: Publish
        if: steps.setup.outputs.enabled == 'true'
        run: |
          # Dependencies first: platform packages and model parts, then
          # filegoblin-models, then the filegoblin launcher.
          set -e
          # Artifacts do not keep file modes.
          chmod +x npm-packages/filegoblin-*-*/bin/filegoblin 2>/dev/null || true
          for d in npm-packages/filegoblin-*-*/ npm-packages/filegoblin-models/ npm-packages/filegoblin/; do
            [ -d "$d" ] || continue
            name=$(node -p "require('./$d/package.json').name")
            version=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$d" --access public
          done
